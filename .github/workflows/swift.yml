name: Swift
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - run: swift build -c release
      - run: swift test
