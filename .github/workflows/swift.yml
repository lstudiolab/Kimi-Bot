name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Show Swift toolchain
        run: swift --version

      - name: Format Swift sources
        run: swift format format --in-place --recursive Sources Tests

      - name: Verify formatting
        run: swift format lint --strict --recursive Sources Tests

      - name: Build release
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors
